name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build (validates content schemas)
        run: npm run build

      - name: Internal links and assets
        run: npm run check:links

      - name: Placeholders (strict on main)
        run: npm run check:placeholders -- ${{ github.ref == 'refs/heads/main' && '--strict' || '' }}

      - name: Content status (references must resolve; open items reported, strict at launch)
        run: npm run check:content
