# Homepage copy (layout: docs/phase-3/homepage-magazine.md; the group, divisions, beyond and presence
# sections are not rendered on the homepage since that redesign, and stay here for Stride to decide).
# status: approved = from the client brief or
# signed off; draft = written by us, shows a "Draft copy" tag in preview and blocks production.
sections:
  hero:
    status: approved
    lines: [Built, around, creators.]
    # "build careers,", "reach audiences," and "and how the next generation gets started." are joined
    # by non-breaking spaces, so the hero never splits them across lines.
    body: One global group. Three businesses shaping how creators build careers, how brands reach audiences, and how the next generation gets started.

  # The award badges on the hero (each label is its image's alt text). Supplied by the owner on
  # 2026-11-04 as one image, split into these files. Confirm with Stride before launch.
  awards:
    status: approved
    items:
      - label: Hello Partner, Top Influencer Marketing Agencies 2024
        image: /assets/site/award-hello-partner-2024.webp
      - label: Influencer Marketing Hub, Top Influencer Marketing Agencies 2025
        image: /assets/site/award-imh-influencer-marketing-2025.webp
      - label: Influencer Marketing Hub, Top TikTok Talent Management Agencies 2025
        image: /assets/site/award-imh-tiktok-talent-2025.webp

  sides:
    status: approved
    headline: Three sides of Stride.
    # The supporting line comes from the section's design brief (2026-11-03); confirm with Stride.
    body: A connected ecosystem for brands, creators, and the next generation.
    items:
      - key: social
        audience: For brands
        label: Social
        copy: Influencer marketing, content, campaigns, and commerce.
        cta: Explore Stride Social
        href: /social
      - key: talent
        audience: For creators
        label: Talent
        copy: Representation, opportunities, and long-term career management.
        cta: Explore Stride Talent
        href: /talent
      - key: education
        audience: For the next generation
        label: Education
        copy: Learn the industry, develop your content, and build your creator career.
        cta: Explore Stride Education
        href: /education

  # The brand partners ticker under the three sides: its cue and the brands it names, in order
  # (ids in src/content/brands). The first twenty are the live site's logo ticker, in its order; the
  # last three were named in the section's design brief (2026-11-03) and have no logo yet. Logos show
  # only under the brand approval rule.
  partners:
    status: approved
    eyebrow: Keep scrolling
    featured:
      [
        student-minds, blitz, unidentified-logo-03, genshin-impact, voodoo, azar, fairy, anker, bloom, zovoo,
        aliexpress, tooletries, tinder, bulldog-skincare, ace, nordvpn, bolt, manscaped, cash-app, merge-gardens,
        samsung, hellofresh, meta,
      ]

  group:
    status: draft
    eyebrow: The group
    headline: One group. Built for what's next.
    # Founding year per the client brief (2022); conflicts with the old site (2020/2021). Q1.
    body: |-
      Stride was established in 2022 and works internationally where creators, brands and media meet.

      We started on the creator side of the camera, and it still shapes how we work. One group, three businesses that feed each other: brands get creators who are genuinely right for them, creators get representation built for the long term, and the next generation gets a way in.
    cta: { label: Our Story, href: /about }

  divisions:
    status: draft
    eyebrow: Stride Talent
    headline: Our divisions.
    body: Specialist talent divisions, each with its own roster, partners and know-how.

  work:
    status: approved
    eyebrow: Selected campaigns
    headline: Our work.
    cta: { label: Explore Our Work, href: /work }
    # Featured in the brief (PDF §3.5) but no approved case study yet (Q6).
    awaiting: [Samsung, Barsys]

  people:
    status: approved
    eyebrow: The team
    headline: The people behind Stride.
    cta: { label: Meet The Team, href: /team }

  beyond:
    status: draft
    eyebrow: Beyond business
    headline: Beyond business.
    body: Creator sponsorships, community projects and the local teams we back.
    cta: { label: Our Sponsorships, href: /sponsorships }

  insights:
    status: approved
    eyebrow: Insights and news
    headline: Insights.
    cta: { label: Explore Insights, href: /insights }

  presence:
    status: approved
    eyebrow: Where we work
    headline: Global presence.
    items:
      - label: Talent markets

  final:
    status: approved
    headline: Let's make something happen.
    items:
      - key: social
        label: Work with Stride Social
        href: /social/enquire
      - key: talent
        label: Join Stride Talent
        href: /talent/apply
      - key: education
        label: Explore Stride Education
        href: /education
